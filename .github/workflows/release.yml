name: build

# Подпись релизов выполняется локально (ключ не хранится в GitHub).
# Этот workflow только проверяет, что проект собирается.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build release (unsigned) and debug
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: codetether-debug-apk
          path: app/build/outputs/apk/debug/*.apk
